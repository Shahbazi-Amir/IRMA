name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: MyPy
        run: mypy
      - name: Tests and coverage
        env:
          IRMA_DATABASE_URL: sqlite:///./ci-test.db
        run: pytest
      - name: Compile
        run: python -m compileall src tests apps scripts
      - name: OpenAPI validation
        run: python -c "from irma.main import app; schema=app.openapi(); assert schema['openapi'].startswith('3.'); assert '/ready' in schema['paths']"
      - name: Migration check
        env:
          IRMA_DATABASE_URL: sqlite:///./migration-test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Repository safety
        run: python scripts/check_repo_safety.py
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t irma-api:ci .
      - name: Build Web image
        run: docker build -f Dockerfile.web -t irma-web:ci .
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config
