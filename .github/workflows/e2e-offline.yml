name: Offline E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated E2E
        run: python scripts/run_e2e.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-e2e-validation
          path: artifacts/
