name: Live FIPIRAN Validation

on:
  push:
    branches:
      - agent/fix-fipiran-record-identity
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 3"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: irma_live_validation
          POSTGRES_USER: irma
          POSTGRES_PASSWORD: live-validation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irma -d irma_live_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Bootstrap and run bounded live validation
        env:
          IRMA_APP_ENV: e2e
          IRMA_DATABASE_URL: postgresql+psycopg://irma:live-validation-only@localhost:5432/irma_live_validation
          IRMA_FUND_PROVIDER: fipiran
          IRMA_FUND_HISTORY_LIMIT: "2"
          IRMA_PROVIDER_MIN_INTERVAL_SECONDS: "1"
          IRMA_PROVIDER_MAX_RETRIES: "2"
        run: |
          mkdir -p artifacts
          python scripts/bootstrap_data.py > artifacts/live-bootstrap.json || true
          python scripts/live_data_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-data-validation
          path: artifacts/
      - name: Add workflow summary
        if: always()
        run: cat artifacts/live-data-validation-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Deduplicate provider degradation issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("artifacts/live-data-validation.json", "utf8"));
            const title = "Live fund data provider degraded";
            const {data} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "live-data"
            });
            const issue = data.find(item => item.title === title);
            if (report.status !== "success") {
              const body = [
                "Automated live validation could not retrieve a validated fund dataset.",
                `Status: \`${report.status}\``,
                `Contract: \`${report.contract_selected}\``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "No fixture was substituted."
              ].join("\n\n");
              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["live-data"]
                });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: "Live validation recovered; closing this deduplicated alert."
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed"
              });
            }
