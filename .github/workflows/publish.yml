name: Publish and Ephemeral Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: irma-api
            dockerfile: Dockerfile
          - image: irma-web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/shahbazi-amir/${{ matrix.image }}:latest
            ghcr.io/shahbazi-amir/${{ matrix.image }}:main
            ghcr.io/shahbazi-amir/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
  ephemeral-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/run_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ephemeral-staging-validation
          path: artifacts/
