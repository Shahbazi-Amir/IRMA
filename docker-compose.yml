services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: irma
      POSTGRES_USER: irma
      POSTGRES_PASSWORD: ${IRMA_DB_PASSWORD:-change-this-local-password}
    volumes:
      - irma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irma -d irma"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      IRMA_DATABASE_URL: postgresql+psycopg://irma:${IRMA_DB_PASSWORD:-change-this-local-password}@database:5432/irma
      IRMA_CORS_ORIGINS: http://localhost:8501
      IRMA_FUND_CSV_PATH: /app/data/imports/funds.csv
    volumes:
      - ./data/imports:/app/data/imports:ro
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      IRMA_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "irma.workers.scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      IRMA_DATABASE_URL: postgresql+psycopg://irma:${IRMA_DB_PASSWORD:-change-this-local-password}@database:5432/irma
    volumes:
      - ./data/imports:/app/data/imports:ro
    depends_on:
      database:
        condition: service_healthy
    profiles: ["scheduler"]
    restart: unless-stopped

volumes:
  irma_postgres_data:
